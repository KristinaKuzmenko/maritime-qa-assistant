# =============================================================================
# Maritime QA App ServiceAccount (IRSA for S3 access)
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: maritime-qa-app
  namespace: maritime-qa
  annotations:
    # IRSA annotation - replace with actual role ARN from Terraform output
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/maritime-qa-dev-app-role"
  labels:
    app: maritime-qa
    component: backend
