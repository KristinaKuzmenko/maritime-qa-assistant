# =============================================================================
# Maritime QA Application Deployment
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: maritime-qa-app
  namespace: maritime-qa
  labels:
    app: maritime-qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maritime-qa
  
  # Rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  template:
    metadata:
      labels:
        app: maritime-qa
      annotations:
        # Force restart on config changes
        checksum/config: "PLACEHOLDER"
    spec:
      serviceAccountName: maritime-qa-app
      
      # Pod security
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
        - name: app
          # ECR image (both backend and frontend in same image)
          image: 930953062641.dkr.ecr.us-east-1.amazonaws.com/maritime-qa-app:latest
          imagePullPolicy: Always
          
          ports:
            - name: backend
              containerPort: 8000
              protocol: TCP
            - name: frontend
              containerPort: 8501
              protocol: TCP
          
          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: maritime-qa-config
            - secretRef:
                name: maritime-qa-secrets
          
          # Additional environment variables
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          
          # Resources
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          # Startup probe for slow-starting containers
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      
      # Topology spread for high availability
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: maritime-qa
              component: backend
      
      # Termination grace period
      terminationGracePeriodSeconds: 30
