# =============================================================================
# Maritime QA Backend Service
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: maritime-qa-backend
  namespace: maritime-qa
  labels:
    app: maritime-qa
    component: backend
spec:
  type: ClusterIP
  ports:
    - name: backend
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: frontend
      port: 8501
      targetPort: 8501
      protocol: TCP
  selector:
    app: maritime-qa

---
# =============================================================================
# LoadBalancer Service (for external access)
# =============================================================================
# Uncomment if you want direct external access without Ingress

# apiVersion: v1
# kind: Service
# metadata:
#   name: maritime-qa-backend-lb
#   namespace: maritime-qa
#   annotations:
#     service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
#     service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
# spec:
#   type: LoadBalancer
#   ports:
#     - name: http
#       port: 80
#       targetPort: 8000
#   selector:
#     app: maritime-qa
#     component: backend

---
# =============================================================================
# Ingress (ALB)
# =============================================================================
# Requires AWS Load Balancer Controller installed

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maritime-qa-ingress
  namespace: maritime-qa
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:930953062641:certificate/6da4aae5-911f-443b-8200-2bfb0ae8fda3
spec:
  rules:
    - host: maritime-qa-assistant.com
      http:
        paths:
          # Frontend (Streamlit) - default path
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maritime-qa-backend
                port:
                  number: 8501
          # Backend API paths
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: maritime-qa-backend
                port:
                  number: 80
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: maritime-qa-backend
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: maritime-qa-backend
                port:
                  number: 80
    - host: www.maritime-qa-assistant.com
      http:
        paths:
          # Frontend (Streamlit) - default path
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maritime-qa-backend
                port:
                  number: 8501
          # Backend API paths
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: maritime-qa-backend
                port:
                  number: 80
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: maritime-qa-backend
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: maritime-qa-backend
                port:
                  number: 80
