# =============================================================================
# Kustomization - Base configuration
# =============================================================================
# Base manifests shared across all environments (dev, staging, prod)
# Used by overlays in k8s/overlays/{env}/
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Infrastructure resources
  - namespace.yaml
  - storageclass.yaml
  
  # Application configuration
  - configmap.yaml
  - external-secrets.yaml
  
  # Application resources
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
