# =============================================================================
# ConfigMap - Application Configuration
# =============================================================================
# Non-sensitive configuration values
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: maritime-qa-config
  namespace: maritime-qa
data:
  # Storage configuration
  STORAGE_TYPE: "s3"
  S3_BUCKET_NAME: "maritime-qa-files"
  S3_BACKUP_BUCKET: "maritime-qa-qdrant-backups"
  AWS_REGION: "us-east-1"
  
  # DynamoDB configuration
  DYNAMODB_USERS_TABLE: "dev-maritime-qa-users"
  
  # Qdrant endpoint is provided via Kubernetes Secret (External Secrets / AWS Secrets Manager)
  # QDRANT_HOST / QDRANT_PORT / QDRANT_API_KEY / QDRANT_USE_HTTPS are expected from secret.
  
  # Neo4j configuration (URI only, password in secret)
  # NEO4J_URI: "neo4j+s://xxxxx.databases.neo4j.io"
  
  # Application settings
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "dev"
  
  # LLM settings
  LLM_MODEL: "gpt-4o-mini"
  EMBEDDING_MODEL: "text-embedding-3-small"
