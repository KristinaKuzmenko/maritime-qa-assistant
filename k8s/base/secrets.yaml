# =============================================================================
# Secrets - Sensitive Configuration
# =============================================================================
# WARNING: Do not commit real secrets to Git!
# Use one of these approaches:
#   1. Sealed Secrets (kubeseal)
#   2. External Secrets Operator (AWS Secrets Manager)
#   3. Vault
#   4. Create manually: kubectl create secret ...
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: maritime-qa-secrets
  namespace: maritime-qa
type: Opaque
stringData:
  # Neo4j credentials
  NEO4J_URI: "REPLACE_WITH_ACTUAL_URI"
  NEO4J_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  
  # OpenAI API key
  OPENAI_API_KEY: "REPLACE_WITH_ACTUAL_KEY"

---
