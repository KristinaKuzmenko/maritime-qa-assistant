# =============================================================================
# External Secrets (AWS Secrets Manager)
# =============================================================================
# Prereqs:
# - External Secrets Operator installed in the cluster
# - A service account used by ESO has IAM permissions for secretsmanager:GetSecretValue
#
# This creates the Kubernetes Secret `maritime-qa-secrets` in namespace `maritime-qa`
# by extracting all key/value pairs from the AWS Secrets Manager secret.
#
# Expected AWS secret name (key): maritime-qa/dev/app
# Expected secret value format: JSON object with keys like OPENAI_API_KEY, NEO4J_PASSWORD, etc.
# =============================================================================

---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: maritime-qa-secrets
  namespace: maritime-qa
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: maritime-qa-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: maritime-qa/dev/app
