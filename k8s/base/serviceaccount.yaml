# =============================================================================
# Maritime QA App ServiceAccount (IRSA for S3 access)
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: maritime-qa-app
  namespace: maritime-qa
  annotations:
    # IRSA annotation for S3 access
    eks.amazonaws.com/role-arn: "arn:aws:iam::930953062641:role/maritime-qa-dev-app-role"
  labels:
    app: maritime-qa
    component: backend
