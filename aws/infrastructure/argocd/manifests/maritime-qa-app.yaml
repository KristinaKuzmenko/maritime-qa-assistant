apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maritime-qa
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: https://github.com/KristinaKuzmenko/maritime-qa-assistant.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: maritime-qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
